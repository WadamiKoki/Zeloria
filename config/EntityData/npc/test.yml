# NPC 定義。1 ファイルが 1 種類の NPC に対応します。
# ファイル名（拡張子なし）が ID のフォールバックになります。
id: "test"
name: "<green>テストNPC</green>"

# スポーンさせるエンティティ種別（Bukkit の EntityType 名）。
# villager / minecraft:villager のような表記も受け付けます。
mobType: "VILLAGER"

# 名前を常時表示するか。
alwaysShowName: true

# 右クリック時の汎用アクション。shop と interact はどちらか一方のみ定義します。
# type: "gui"（GUI を開く）/ "command"（コンソール実行）/ "none"（何もしない）
interact:
  type: "gui"
  gui-id: "menu"

# 見た目用の装備。未指定または AIR は非表示。
# NPC の装備はドロップしません。
equipment:
  mainHand: "AIR"
  helmet: "AIR"
  chestplate: "AIR"
  leggings: "AIR"
  boots: "AIR"
