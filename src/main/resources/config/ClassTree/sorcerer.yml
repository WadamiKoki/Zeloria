# ============================================================================
# ソーサラー用クラスツリー
# 位置・アイコンは config/TreeData/tree.yml の共通形状を使用する。
# ============================================================================

# クラス ID はファイル名から決定します（sorcerer.yml → sorcerer）。
# ClassData/*.yml の id と重複するため、このファイルには id を定義しません。
title: "<gradient:#BA68C8:#4A148C><bold>ソーサラー・ツリー</bold></gradient>"

nodes:
  root:
    displayName: "<light_purple><bold>魔力の源</bold></light_purple>"
    description: ["<gray>ソーサラーのクラスツリーの起点。</gray>", "<gray>魔力と呪文の威力を高める。</gray>"]
    cost: 0
    effectLore: ["<green>・クラスツリーを解放できるようになる</green>"]

  green_1:
    displayName: "<green>魔力錬成 I</green>"
    description: ["<gray>魔力の扱いを学び、攻撃力を高める。</gray>"]
    cost: 1
    requires: ["root"]
    effectLore: ["<green>・攻撃力 +2</green>"]
    statEffects: { attackPower: 2.0 }

  green_2:
    displayName: "<green>魔力循環 I</green>"
    description: ["<gray>体内の魔力を増やす。</gray>"]
    cost: 1
    requires: ["root"]
    effectLore: ["<green>・最大マナ +5</green>"]
    statEffects: { maxMana: 5.0 }

  green_3:
    displayName: "<green>瞑想 I</green>"
    description: ["<gray>魔力の回復効率を高める。</gray>"]
    cost: 1
    requires: ["root"]
    effectLore: ["<green>・マナ自動回復 +0.2</green>"]
    statEffects: { manaRegenFlat: 0.2 }

  green_4:
    displayName: "<green>魔力錬成 II</green>"
    description: ["<gray>高位魔法のための魔力を練る。</gray>"]
    cost: 1
    requires: ["green_1"]
    effectLore: ["<green>・攻撃力 +2</green>"]
    statEffects: { attackPower: 2.0 }

  green_5:
    displayName: "<green>魔力循環 II</green>"
    description: ["<gray>魔力の器をさらに広げる。</gray>"]
    cost: 1
    requires: ["green_2"]
    effectLore: ["<green>・最大マナ +4</green>"]
    statEffects: { maxMana: 4.0 }

  green_6:
    displayName: "<green>詠唱短縮 I</green>"
    description: ["<gray>詠唱の無駄を削ぎ落とす。</gray>"]
    cost: 1
    requires: ["green_3"]
    effectLore: ["<green>・クールダウン短縮 +2%</green>"]
    statEffects: { cooldownReduction: 0.02 }

  green_7:
    displayName: "<green>魔力増幅</green>"
    description: ["<gray>魔力の出力を高める。</gray>"]
    cost: 1
    requires: ["green_4"]
    effectLore: ["<green>・攻撃力 +3%</green>"]
    statEffects: { attackPowerPercent: 3.0 }

  blue_1:
    displayName: "<aqua><bold>ファイアボール強化 I</bold></aqua>"
    description: ["<gray>火球の威力を高める。</gray>"]
    cost: 1
    requires: []
    requiresAny: ["green_4", "green_5"]
    effectLore: ["<aqua>・スキル1のダメージ +10%</aqua>"]
    skillEffects: { skillDamage_sorcerer_skill1: 0.1 }

  blue_2:
    displayName: "<aqua><bold>アイススパイク強化 I</bold></aqua>"
    description: ["<gray>氷槍の威力を高める。</gray>"]
    cost: 1
    requires: []
    requiresAny: ["green_5", "green_6"]
    effectLore: ["<aqua>・スキル2のダメージ +10%</aqua>"]
    skillEffects: { skillDamage_sorcerer_skill2: 0.1 }

  blue_3:
    displayName: "<aqua><bold>サンダーストーム強化 I</bold></aqua>"
    description: ["<gray>雷嵐の威力を高める。</gray>"]
    cost: 1
    requires: []
    requiresAny: ["green_6", "green_7"]
    effectLore: ["<aqua>・スキル3のダメージ +10%</aqua>"]
    skillEffects: { skillDamage_sorcerer_skill3: 0.1 }

  blue_4:
    displayName: "<aqua><bold>大魔法の極意</bold></aqua>"
    description: ["<gray>火球魔法の完成度を高める。</gray>"]
    cost: 1
    requires: ["blue_1"]
    effectLore: ["<aqua>・スキル1のダメージ +5%</aqua>"]
    skillEffects: { skillDamage_sorcerer_skill1: 0.05 }

  red_1:
    displayName: "<red><bold>獄炎球</bold></red>"
    description: ["<gray>消えることのない獄炎を放つ。</gray>"]
    cost: 2
    requires: ["blue_1"]
    effectLore: ["<red>・ファイアボールが獄炎球に変化</red>"]
    replaceSkill: "sorcerer_skill1_arcane"

  red_2:
    displayName: "<red><bold>氷獄の槍</bold></red>"
    description: ["<gray>凍てつく巨大な氷槍を召喚する。</gray>"]
    cost: 2
    requires: ["blue_2"]
    effectLore: ["<red>・アイススパイクが氷獄の槍に変化</red>"]
    replaceSkill: "sorcerer_skill2_arcane"

  red_3:
    displayName: "<red><bold>天雷崩落</bold></red>"
    description: ["<gray>天から無数の雷を落とす。</gray>"]
    cost: 2
    requires: ["blue_3"]
    effectLore: ["<red>・サンダーストームが天雷崩落に変化</red>"]
    replaceSkill: "sorcerer_skill3_arcane"

  green_8:
    displayName: "<green>魔力錬成 III</green>"
    description: ["<gray>大魔法使いの魔力を身につける。</gray>"]
    cost: 1
    requires: ["red_1"]
    effectLore: ["<green>・攻撃力 +3</green>"]
    statEffects: { attackPower: 3.0 }

  green_9:
    displayName: "<green>魔力循環 III</green>"
    description: ["<gray>尽きることのない魔力を手に入れる。</gray>"]
    cost: 1
    requires: ["red_1"]
    effectLore: ["<green>・最大マナ +5</green>"]
    statEffects: { maxMana: 5.0 }

  green_10:
    displayName: "<green>瞑想 II</green>"
    description: ["<gray>深い瞑想で魔力を急速に回復する。</gray>"]
    cost: 1
    requires: ["red_2"]
    effectLore: ["<green>・マナ自動回復 +0.3</green>"]
    statEffects: { manaRegenFlat: 0.3 }

  green_11:
    displayName: "<green><bold>魔導の極致</bold></green>"
    description: ["<gray>ソーサラーの魔力を極める。</gray>"]
    cost: 2
    requiresAny: ["green_8", "green_9", "green_10"]
    effectLore: ["<green>・攻撃力 +5%</green>"]
    statEffects: { attackPowerPercent: 5.0 }
