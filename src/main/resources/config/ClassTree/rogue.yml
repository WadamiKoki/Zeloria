# ============================================================================
# ローグ用クラスツリー
# ----------------------------------------------------------------------------
# 位置・アイコンは config/TreeData/tree.yml の共通形状を使用する。
# ここでは表示名・説明・コスト・解放条件・効果だけを定義する。
# ============================================================================

id: "rogue"
title: "<gradient:#00bcd4:#004d40><bold>ローグ・ツリー</bold></gradient>"

nodes:
  root:
    displayName: "<dark_aqua><bold>影の心得</bold></dark_aqua>"
    description:
      - "<gray>ローグのクラスツリーの起点。</gray>"
      - "<gray>影に潜み、急所を狙う技術の基礎を学ぶ。</gray>"
    cost: 0
    effects:
      - "<dark_aqua>・クラスツリーを解放できるようになる</dark_aqua>"

  offense_1:
    displayName: "<red>短剣鍛錬 I</red>"
    description:
      - "<gray>短剣の扱いに慣れ、素早い斬撃を身につける。</gray>"
    cost: 1
    requires: ["root"]
    effects:
      - "<red>・攻撃力 +2</red>"

  offense_2:
    displayName: "<red>短剣鍛錬 II</red>"
    description:
      - "<gray>連続攻撃の精度を高め、手数を増やす。</gray>"
    cost: 2
    requires: ["offense_1"]
    effects:
      - "<red>・攻撃力 +3</red>"
      - "<red>・攻撃速度 +3%</red>"

  offense_3:
    displayName: "<red>暗殺術</red>"
    description:
      - "<gray>敵の隙を見極め、一撃で大ダメージを与える。</gray>"
    cost: 2
    requires: ["offense_2"]
    effects:
      - "<red>・攻撃力 +4</red>"
      - "<red>・クリティカル率 +3%</red>"

  offense_4:
    displayName: "<dark_red>影斬</dark_red>"
    description:
      - "<gray>影と一体となり、回避不能の斬撃を放つ。</gray>"
    cost: 3
    requires: ["offense_3"]
    effects:
      - "<red>・攻撃力 +8</red>"
      - "<red>・クリティカルダメージ +10%</red>"

  precision_1:
    displayName: "<aqua>致命 I</aqua>"
    description:
      - "<gray>急所の位置を学び、狙いを定める。</gray>"
    cost: 1
    requires: ["root"]
    effects:
      - "<aqua>・命中率 +3%</aqua>"

  precision_2:
    displayName: "<aqua>致命 II</aqua>"
    description:
      - "<gray>相手の動きを読み、確実に急所を捉える。</gray>"
    cost: 2
    requires: ["precision_1"]
    effects:
      - "<aqua>・命中率 +5%</aqua>"
      - "<aqua>・クリティカル率 +3%</aqua>"

  precision_3:
    displayName: "<aqua>急所見極め</aqua>"
    description:
      - "<gray>わずかな隙も逃さない観察眼を磨く。</gray>"
    cost: 2
    requires: ["precision_2"]
    effects:
      - "<aqua>・命中率 +5%</aqua>"
      - "<aqua>・クリティカル率 +5%</aqua>"

  utility_1:
    displayName: "<yellow>身軽 I</yellow>"
    description:
      - "<gray>無駄のない動きで素早く立ち回る。</gray>"
    cost: 1
    requires: ["root"]
    effects:
      - "<yellow>・移動速度 +3%</yellow>"

  utility_2:
    displayName: "<yellow>身軽 II</yellow>"
    description:
      - "<gray>狭い地形でも機敏に動ける身体能力を養う。</gray>"
    cost: 2
    requires: ["utility_1"]
    effects:
      - "<yellow>・移動速度 +3%</yellow>"
      - "<yellow>・回避率 +3%</yellow>"

  utility_3:
    displayName: "<yellow>逃走術</yellow>"
    description:
      - "<gray>危機を察知し、戦線から素早く離脱する。</gray>"
    cost: 2
    requires: ["utility_2"]
    effects:
      - "<yellow>・回避率 +5%</yellow>"
      - "<yellow>・スキルクールダウン短縮 +3%</yellow>"

  fusion:
    displayName: "<light_purple>影分身の極意</light_purple>"
    description:
      - "<gray>攻撃・致命・機動のうち 2 系統を修めた者だけが</gray>"
      - "<gray>習得できる複合技術。</gray>"
    cost: 3
    requiresAny: ["offense_2", "precision_2", "utility_2"]
    effects:
      - "<light_purple>・攻撃力 +5</light_purple>"
      - "<light_purple>・回避率 +3%</light_purple>"

  ultimate:
    displayName: "<gold><bold>影帝</bold></gold>"
    description:
      - "<gray>ローグの最終奥義。影そのものとなり敵を葬る。</gray>"
    cost: 5
    requires: ["fusion"]
    requiresAny: ["offense_3", "precision_3", "utility_3"]
    effects:
      - "<gold>・攻撃力 +10</gold>"
      - "<gold>・クリティカル率 +5%</gold>"
      - "<gold>・クリティカルダメージ +15%</gold>"
