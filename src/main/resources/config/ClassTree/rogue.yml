# ============================================================================
# ローグ用クラスツリー
# 位置・アイコンは config/TreeData/tree.yml の共通形状を使用する。
# ============================================================================

# クラス ID はファイル名から決定します（rogue.yml → rogue）。
# ClassData/*.yml の id と重複するため、このファイルには id を定義しません。
title: "<gradient:#B39DDB:#5E35B1><bold>ローグ・ツリー</bold></gradient>"

nodes:
  root:
    displayName: "<light_purple><bold>影の足音</bold></light_purple>"
    description: ["<gray>ローグのクラスツリーの起点。</gray>", "<gray>機動力と急所狙いを伸ばす。</gray>"]
    cost: 0
    effectLore: ["<green>・クラスツリーを解放できるようになる</green>"]

  green_1:
    displayName: "<green>短剣鍛錬 I</green>"
    description: ["<gray>素早い刺突を反復する。</gray>"]
    cost: 1
    requires: ["root"]
    effectLore: ["<green>・攻撃力 +2</green>"]
    statEffects: { attackPower: 2.0 }

  green_2:
    displayName: "<green>身かわし I</green>"
    description: ["<gray>攻撃を見切る感覚を磨く。</gray>"]
    cost: 1
    requires: ["root"]
    effectLore: ["<green>・回避 +1</green>"]
    statEffects: { evasion: 1.0 }

  green_3:
    displayName: "<green>急所狙い I</green>"
    description: ["<gray>相手の隙を突く技術を学ぶ。</gray>"]
    cost: 1
    requires: ["root"]
    effectLore: ["<green>・クリティカル率 +1%</green>"]
    statEffects: { criticalRate: 1.0 }

  green_4:
    displayName: "<green>短剣鍛錬 II</green>"
    description: ["<gray>連撃の精度を高める。</gray>"]
    cost: 1
    requires: ["green_1"]
    effectLore: ["<green>・攻撃力 +2</green>"]
    statEffects: { attackPower: 2.0 }

  green_5:
    displayName: "<green>軽業 I</green>"
    description: ["<gray>身のこなしをさらに軽くする。</gray>"]
    cost: 1
    requires: ["green_2"]
    effectLore: ["<green>・移動速度 +1%</green>"]
    statEffects: { moveSpeedPercent: 1.0 }

  green_6:
    displayName: "<green>影隠れ</green>"
    description: ["<gray>気配を消し、回避の隙を減らす。</gray>"]
    cost: 1
    requires: ["green_3"]
    effectLore: ["<green>・ドッジクールダウン短縮 +2%</green>"]
    statEffects: { dodgeCooldownReduction: 0.02 }

  green_7:
    displayName: "<green>急所狙い II</green>"
    description: ["<gray>急所への一撃を重くする。</gray>"]
    cost: 1
    requires: ["green_4"]
    effectLore: ["<green>・クリティカルダメージ +5%</green>"]
    statEffects: { criticalDamage: 5.0 }

  blue_1:
    displayName: "<aqua><bold>シャドウステップ強化 I</bold></aqua>"
    description: ["<gray>影移動スキルの威力を高める。</gray>"]
    cost: 1
    requires: []
    requiresAny: ["green_4", "green_5"]
    effectLore: ["<aqua>・スキル1のダメージ +10%</aqua>"]
    skillEffects: { skillDamage_rogue_skill1: 0.1 }

  blue_2:
    displayName: "<aqua><bold>ポイズンブレード強化 I</bold></aqua>"
    description: ["<gray>毒刃スキルの威力を高める。</gray>"]
    cost: 1
    requires: []
    requiresAny: ["green_5", "green_6"]
    effectLore: ["<aqua>・スキル2のダメージ +10%</aqua>"]
    skillEffects: { skillDamage_rogue_skill2: 0.1 }

  blue_3:
    displayName: "<aqua><bold>バックスタブ強化 I</bold></aqua>"
    description: ["<gray>背後からの一撃を強化する。</gray>"]
    cost: 1
    requires: []
    requiresAny: ["green_6", "green_7"]
    effectLore: ["<aqua>・スキル3のダメージ +10%</aqua>"]
    skillEffects: { skillDamage_rogue_skill3: 0.1 }

  blue_4:
    displayName: "<aqua><bold>影の極意</bold></aqua>"
    description: ["<gray>影移動スキルの完成度を高める。</gray>"]
    cost: 1
    requires: ["blue_1"]
    effectLore: ["<aqua>・スキル1のダメージ +5%</aqua>"]
    skillEffects: { skillDamage_rogue_skill1: 0.05 }

  red_1:
    displayName: "<red><bold>瞬影連斬</bold></red>"
    description: ["<gray>影から影へ渡り、連続で斬りつける。</gray>"]
    cost: 2
    requires: ["blue_1"]
    effectLore: ["<red>・シャドウステップが瞬影連斬に変化</red>"]
    replaceSkill: "rogue_skill1_shadow"

  red_2:
    displayName: "<red><bold>致命毒刃</bold></red>"
    description: ["<gray>毒を極限まで濃縮し、致命傷を与える。</gray>"]
    cost: 2
    requires: ["blue_2"]
    effectLore: ["<red>・ポイズンブレードが致命毒刃に変化</red>"]
    replaceSkill: "rogue_skill2_shadow"

  red_3:
    displayName: "<red><bold>影縫い</bold></red>"
    description: ["<gray>敵の影を縫い止め、動きを封じる。</gray>"]
    cost: 2
    requires: ["blue_3"]
    effectLore: ["<red>・バックスタブが影縫いに変化</red>"]
    replaceSkill: "rogue_skill3_shadow"

  green_8:
    displayName: "<green>短剣鍛錬 III</green>"
    description: ["<gray>暗殺者の技を極める。</gray>"]
    cost: 1
    requires: ["red_1"]
    effectLore: ["<green>・攻撃力 +3</green>"]
    statEffects: { attackPower: 3.0 }

  green_9:
    displayName: "<green>急所狙い III</green>"
    description: ["<gray>必殺の一撃を磨く。</gray>"]
    cost: 1
    requires: ["red_1"]
    effectLore: ["<green>・クリティカル率 +2%</green>"]
    statEffects: { criticalRate: 2.0 }

  green_10:
    displayName: "<green>身かわし II</green>"
    description: ["<gray>あらゆる攻撃を紙一重でかわす。</gray>"]
    cost: 1
    requires: ["red_2"]
    effectLore: ["<green>・回避 +2</green>"]
    statEffects: { evasion: 2.0 }

  green_11:
    displayName: "<green><bold>影の極致</bold></green>"
    description: ["<gray>ローグの攻撃力を極める。</gray>"]
    cost: 2
    requiresAny: ["green_8", "green_9", "green_10"]
    effectLore: ["<green>・攻撃力 +5%</green>"]
    statEffects: { attackPowerPercent: 5.0 }
