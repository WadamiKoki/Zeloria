id: "rogue"
displayName: "<dark_aqua><bold>ローグ</bold></dark_aqua>"
description:
  - "<gray>素早い動きで敵の背後を取る</gray>"
icon: "IRON_SWORD"
unlockedByDefault: true
# このクラスで使用できるスキルID（SkillData/ 配下の id と一致させる）。
# スキルスロット実装時にここへ紐付けるスキルを追加する。
skills:
  - "rogue_skill1"
  - "rogue_skill2"
  - "rogue_skill3"
  - "rogue_skill4"
  - "rogue_skill5"

# このクラスで使用できる武器タイプ（WeaponData の weaponTypes と一致させる）。
# 空または未指定の場合は全武器を許可する。
weaponTypes: [DAGGER]

# 基礎ステータス（レベル1時のステータス）
baseStats:
  maxHealth: 20.0
  maxMana: 100.0
  attackPower: 1.0
  defense1: 0.0
  defense2: 0.0
  criticalRate: 5.0
  criticalDamage: 50.0
  accuracy: 90.0
  evasion: 5.0
  dodgeCooldownReduction: 0.0
  cooldownReduction: 0.0
  moveSpeed: 0.2
  healthRegenFlat: 0.0
  healthRegenPercent: 0.02
  manaRegenFlat: 0.0
  manaRegenPercent: 0.05
  armorPenetration: 0.0
  lifesteal: 0.0

# レベルアップごとの成長率（%／レベル、単利成長）
# 計算式: 実効値 = baseStats × (1 + 成長率[%] / 100 × (レベル - 1))
# 例: maxHealth が 10.0 の場合、レベル5 では 20.0 × (1 + 0.10 × 4) = 28.0
# 基礎値が 0 の項目は割合を掛けても 0 のままなので、成長させたい項目は
# baseStats 側に 0 以外の値を設定すること。
levelUpPercent:
  maxHealth: 10.0
  maxMana: 10.0
  attackPower: 50.0
  defense1: 0.0
  defense2: 0.0
  criticalRate: 2.0
  criticalDamage: 0.0
  accuracy: 0.5
  evasion: 2.0
  dodgeCooldownReduction: 0.0
  cooldownReduction: 0.0
  moveSpeed: 0.0
  healthRegenFlat: 0.0
  healthRegenPercent: 0.02
  manaRegenFlat: 0.0
  manaRegenPercent: 0.01
  armorPenetration: 0.0
  lifesteal: 0.0
