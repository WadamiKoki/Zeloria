id: "archer"
displayName: "<green><bold>アーチャー</bold></green>"
description:
  - "<gray>遠距離から正確に敵を射抜き、トラップで足止めする</gray>"
icon: "BOW"
unlockedByDefault: true
# このクラスで使用できるスキルID（SkillData/ 配下の id と一致させる）。
# スキルスロット実装時にここへ紐付けるスキルを追加する。
skills:
  - "archer_skill1"
  - "archer_skill2"
  - "archer_skill3"
  - "archer_skill4"
  - "archer_skill5"

# 基礎ステータス（レベル1時のステータス）
baseStats:
  maxHealth: 20.0
  maxMana: 100.0
  attackPower: 1.0
  defense1: 0.0
  defense2: 0.0
  criticalRate: 5.0
  criticalDamage: 50.0
  accuracy: 90.0
  evasion: 5.0
  dodgeCooldownReduction: 0.0
  cooldownReduction: 0.0
  moveSpeed: 0.2
  healthRegenFlat: 0.0
  healthRegenPercent: 0.02
  manaRegenFlat: 0.0
  manaRegenPercent: 0.05
  armorPenetration: 0.0
  lifesteal: 0.0

# レベルアップごとの成長率（%／レベル、単利成長）
# 計算式: 実効値 = baseStats × (1 + 成長率[%] / 100 × (レベル - 1))
# 例: maxHealth が 10.0 の場合、レベル5 では 20.0 × (1 + 0.10 × 4) = 28.0
# 基礎値が 0 の項目は割合を掛けても 0 のままなので、成長させたい項目は
# baseStats 側に 0 以外の値を設定すること。
levelUpPercent:
  maxHealth: 10.0
  maxMana: 10.0
  attackPower: 50.0
  defense1: 0.0
  defense2: 0.0
  criticalRate: 2.0
  criticalDamage: 0.0
  accuracy: 0.5
  evasion: 2.0
  dodgeCooldownReduction: 0.0
  cooldownReduction: 0.0
  moveSpeed: 0.0
  healthRegenFlat: 0.0
  healthRegenPercent: 0.0
  manaRegenFlat: 0.0
  manaRegenPercent: 0.0
  armorPenetration: 0.0
  lifesteal: 0.0
