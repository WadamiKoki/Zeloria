id: "field_1"
name: "平原フィールド"
templateId: "field_1"
maxInstances: 1
isShared: false

display:
  title: "<gradient:#7ed321:#417505><bold>平原フィールド</bold></gradient>"
  subtitle: "<gray>のどかな草原が広がっている...</gray>"
  fade_in: 10
  stay: 40
  fade_out: 10
  sound: "block.note_block.bell"
  volume: 0.8
  pitch: 0.9

portals:
  - id: "to_hub"
    from:
      x: 0.5
      y: 65.0
      z: 0.5
    to:
      world: "hub"
      x: 0.5
      y: 65.0
      z: 0.5
      yaw: 0.0
      pitch: 0.0
    radius: 1.0

# 定点スポナー。LayerData 内に直接スポーン設定を記述します。
# - mobId: EntityData/mob の id
# - minLevel / maxLevel: スポーン時のレベル範囲（baseLevel との差でステータスを補正）
# - x / y / z: スポナー座標（y は固定、x / z は spawnRange の範囲でランダムにズレる）
# - spawnRateSeconds: 判定間隔（最小 30 秒）
# - maxAlive: 同時生存上限（最大 5 でクランプ）
# - spawnLimit: 1 回の判定での最大湧き数
# - spawnRadius: プレイヤー検知半径（サバイバル／アドベンチャーのみ対象）
# - spawnRange: 水平方向のズレ幅（±ブロック）
spawners:
  - mobId: "goblin"
    minLevel: 1
    maxLevel: 10
    x: 8.5
    y: 65.0
    z: 8.5
    spawnRateSeconds: 30
    maxAlive: 3
    spawnLimit: 10
    spawnRadius: 16.0
    spawnRange: 3.0
  - mobId: "goblin"
    minLevel: 1
    maxLevel: 10
    x: -8.5
    y: 65.0
    z: -8.5
    spawnRateSeconds: 30
    maxAlive: 3
    spawnLimit: 10
    spawnRadius: 16.0
    spawnRange: 3.0
