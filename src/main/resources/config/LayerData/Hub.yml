id: "hub"
name: "中心街"
templateId: "hub"
maxInstances: 1
isShared: true

display:
  title: "<gradient:#00c6ff:#0072ff><bold>中央都市</bold></gradient>"
  subtitle: "<gray>ようこそ、<white>{player}</white> さん</gray>"
  fade_in: 10
  stay: 50
  fade_out: 10
  sound: "block.note_block.pling"
  volume: 1.0
  pitch: 1.2

portals:
  - id: "to_field"
    from:
      world: "hub_instance_1"
      x: 0.5
      y: 65.0
      z: 0.5
    to:
      world: "field_1"
      x: 0.5
      y: 65.0
      z: 0.5
      yaw: 0.0
      pitch: 0.0
    radius: 1.0

npcs:
  - npcId: test
    x: 3.5
    y: 65.0
    z: 0.5
    yaw: 90.0
    pitch: 0.0
  - npcId: shop_buy
    x: 6.5
    y: 65.0
    z: 0.5
    yaw: 90.0
    pitch: 0.0
  - npcId: shop_sell
    x: 9.5
    y: 65.0
    z: 0.5
    yaw: 90.0
    pitch: 0.0
  - npcId: blacksmith
    x: 12.5
    y: 65.0
    z: 0.5
    yaw: 90.0
    pitch: 0.0

# 中心街にはモブを湧かせないため spawners は空。
