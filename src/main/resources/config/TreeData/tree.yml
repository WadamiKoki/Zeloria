# ============================================================================
# クラスツリー共通形状
# ----------------------------------------------------------------------------
# 全クラスで共有する「ノードの位置」と「アイコン」を定義する。
# クラスごとの表示名・説明・コスト・解放条件・効果は
# config/ClassTree/<classId>.yml に定義する。
# ============================================================================

title: "クラスツリー"
rows: 6
visible_rows: 6
fixed_column: 8

fixed_slots:
  reset: 8      # row 0, col 8
  down: 26      # row 2, col 8（下スクロール）
  up: 35        # row 3, col 8（上スクロール）
  close: 53     # row 5, col 8

nodes:
  root:      { row: 0, column: 4, icon: "END_PORTAL_FRAME" }
  green_1:   { row: 1, column: 1, icon: "LIME_CONCRETE" }
  green_2:   { row: 1, column: 3, icon: "LIME_CONCRETE" }
  green_3:   { row: 1, column: 5, icon: "LIME_CONCRETE" }
  green_4:   { row: 2, column: 0, icon: "LIME_CONCRETE" }
  green_5:   { row: 2, column: 2, icon: "LIME_CONCRETE" }
  green_6:   { row: 2, column: 4, icon: "LIME_CONCRETE" }
  green_7:   { row: 2, column: 6, icon: "LIME_CONCRETE" }
  blue_1:    { row: 3, column: 0, icon: "BLUE_NETHER_BRICKS" }
  blue_2:    { row: 3, column: 2, icon: "BLUE_NETHER_BRICKS" }
  blue_3:    { row: 3, column: 4, icon: "BLUE_NETHER_BRICKS" }
  blue_4:    { row: 3, column: 6, icon: "BLUE_NETHER_BRICKS" }
  red_1:     { row: 4, column: 1, icon: "RED_NETHER_BRICKS" }
  red_2:     { row: 4, column: 3, icon: "RED_NETHER_BRICKS" }
  red_3:     { row: 4, column: 5, icon: "RED_NETHER_BRICKS" }
  green_8:   { row: 5, column: 0, icon: "LIME_CONCRETE" }
  green_9:   { row: 5, column: 2, icon: "LIME_CONCRETE" }
  green_10:  { row: 5, column: 4, icon: "LIME_CONCRETE" }
  green_11:  { row: 5, column: 6, icon: "LIME_CONCRETE" }

