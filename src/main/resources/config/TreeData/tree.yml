# ============================================================================
# クラスツリー共通形状
# ----------------------------------------------------------------------------
# 全クラスで共有する「ノードの位置」と「アイコン」を定義する。
# クラスごとの表示名・説明・コスト・解放条件・効果は
# config/ClassTree/<classId>.yml に定義する。
# ============================================================================

title: "クラスツリー"
rows: 6
visible_rows: 6
# 固定UI用の列。この列は常に灰色ガラスで埋まり、スクロールの影響を受けない。
# 固定ボタン（reset / down / up / close）は col 8 に置く。
fixed_column: 7

fixed_slots:
  reset: 8      # row 0, col 8
  down: 26      # row 2, col 8（下スクロール）
  up: 35        # row 3, col 8（上スクロール）
  close: 53     # row 5, col 8

nodes:
  # custom_model_data は任意。リソースパックでノードの見た目を差し替える場合に設定する。
  # 0 または未設定の場合はバニラのアイコンがそのまま表示される。
  root:      { row: 0, column: 3, icon: "NETHER_STAR", custom_model_data: 1001 }
  green_1:   { row: 1, column: 1, icon: "EXPERIENCE_BOTTLE", custom_model_data: 2001 }
  green_2:   { row: 1, column: 3, icon: "EXPERIENCE_BOTTLE", custom_model_data: 2002 }
  green_3:   { row: 1, column: 5, icon: "EXPERIENCE_BOTTLE", custom_model_data: 2003 }
  green_4:   { row: 2, column: 0, icon: "EXPERIENCE_BOTTLE", custom_model_data: 2004 }
  green_5:   { row: 2, column: 2, icon: "EXPERIENCE_BOTTLE", custom_model_data: 2005 }
  green_6:   { row: 2, column: 4, icon: "EXPERIENCE_BOTTLE", custom_model_data: 2006 }
  green_7:   { row: 2, column: 6, icon: "EXPERIENCE_BOTTLE", custom_model_data: 2007 }
  blue_1:    { row: 3, column: 0, icon: "AMETHYST_SHARD", custom_model_data: 3001 }
  blue_2:    { row: 3, column: 2, icon: "AMETHYST_SHARD", custom_model_data: 3002 }
  blue_3:    { row: 3, column: 4, icon: "AMETHYST_SHARD", custom_model_data: 3003 }
  blue_4:    { row: 3, column: 6, icon: "AMETHYST_SHARD", custom_model_data: 3004 }
  red_1:     { row: 4, column: 1, icon: "BLAZE_POWDER", custom_model_data: 4001 }
  red_2:     { row: 4, column: 3, icon: "BLAZE_POWDER", custom_model_data: 4002 }
  red_3:     { row: 4, column: 5, icon: "BLAZE_POWDER", custom_model_data: 4003 }
  green_8:   { row: 5, column: 0, icon: "EXPERIENCE_BOTTLE", custom_model_data: 2008 }
  green_9:   { row: 5, column: 2, icon: "EXPERIENCE_BOTTLE", custom_model_data: 2009 }
  green_10:  { row: 5, column: 4, icon: "EXPERIENCE_BOTTLE", custom_model_data: 2010 }
  green_11:  { row: 5, column: 6, icon: "EXPERIENCE_BOTTLE", custom_model_data: 2011 }

