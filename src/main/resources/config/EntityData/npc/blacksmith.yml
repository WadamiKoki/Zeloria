# 鍛冶屋 NPC。販売屋（sell）テンプレートを使用する。
id: "blacksmith"
name: "<gold>鍛冶屋</gold>"
mobType: "VILLAGER"
alwaysShowName: true

# 店舗定義。商品リストはここに直接記述する。
# slot は不要で、YAML に書いた順番に商品エリアの左上（10）から自動配置する。
shop:
  template: "sell"
  items:
    # ItemData/weapon/sword/test.yml に実在する武器。
    - item-id: "sword_test_sword"
      price: 500

equipment:
  mainHand: "AIR"
  helmet: "AIR"
  chestplate: "AIR"
  leggings: "AIR"
  boots: "AIR"
