id: "shop_sell"
name: "<gold>販売屋</gold>"
mobType: "VILLAGER"
alwaysShowName: true

# 販売屋（アイテム購入）。GUI レイアウトは GuiData/shop_sell.yml を使用する。
# slot は不要。記述順に商品エリア（10〜16, 19〜25, 28〜34, 37〜43）へ自動配置する。
shop:
  template: "sell"
  items:
    # ItemData に実在するアイテム（material/iron_ore.yml, armor/helmet/test.yml）。
    - item-id: "iron_ore"
      price: 50
    - item-id: "helmet"
      price: 800

equipment:
  mainHand: "AIR"
  helmet: "AIR"
  chestplate: "AIR"
  leggings: "AIR"
  boots: "AIR"
