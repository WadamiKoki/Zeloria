id: "level_settings"
name: "レベル・経験値設定"

# 必要経験値は Wynncraft 方式の二次関数で算出します。
#   次レベルまで : base_exp * (2 * level - 1)
#   累計経験値   : base_exp * (level - 1)^2
# 例: base_exp=1200 の場合
#   Lv.1 -> 2 : 1200
#   Lv.2 -> 3 : 3600
#   Lv.99 -> 100 : 236400
# stages / exp_growth は廃止されました。

base_exp: 1200

# 到達可能な最大レベル。
max_level: 100

# クラスレベルが 1 上がるごとに付与するクラスツリーポイント。
tree_points_per_level: 1

# レベルアップ時の通知演出。
level_up:
  sound:
    key: "entity.player.levelup"
    volume: 1.0
    pitch: 1.0

  particle:
    type: "HAPPY_VILLAGER"
    count: 30
    offset_x: 0.5
    offset_y: 0.8
    offset_z: 0.5
    extra: 0.0

  particle_y_offset: 1.0

