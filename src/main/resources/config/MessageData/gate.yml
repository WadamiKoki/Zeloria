id: "gate"
name: "ポータル／ゲート関連メッセージ"

# MiniMessage 形式で記述します。
# {time} などの波括弧プレースホルダーは送信時に置換されます。
portal:
  cooldown: "<red>クールダウン中です</red> <gray>（残り <yellow>{time}</yellow> 秒）</gray>"
  warping: "<aqua>ポータル</aqua> <gray>→</gray> <white>{layer_name}</white> <gray>へ転送します...</gray>"
  creating: "<aqua>{layer_name}</aqua> <gray>を準備しています...</gray> <gray>完了までお待ちください。</gray>"
  not_found: "<gray>近くにポータルはありません。</gray>"
  creation_failed: "<red>転送先レイヤーを生成できませんでした: <white>{layer_name}</white></red>"
  teleport_failed: "<red>転送に失敗しました。もう一度お試しください。</red>"
  used: "<green>{layer_name}</green> <gray>へ入場しました。</gray>"
